# Control del gremio. El ciclo está en foundry/referencias/harness-autoauditoria.md.
# Lunes 12:00 UTC = 09:00 America/Buenos_Aires.
name: Gremio

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: gremio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  controlar:
    runs-on: ubuntu-latest
    steps:
      - name: Código del pull request
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Código de la rama
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Autoprueba del auditor
        run: python3 foundry/scripts/auditar_gremio.py --autoprueba

      - name: Autoprueba del corrector
        run: python3 foundry/scripts/corregir_gremio.py --autoprueba

      - name: Corregir enlaces del índice
        if: github.event_name != 'push' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: python3 foundry/scripts/corregir_gremio.py --aplicar

      - name: Auditor estricto
        run: |
          python3 foundry/scripts/auditar_gremio.py --estricto || {
            echo "Corte: quedó un error. Este job no edita descriptions, pisos ni dueños."
            exit 1
          }

      - name: Empaquetar
        run: python3 empaquetar.py

      - name: Subir la corrección mecánica
        if: success() && github.event_name != 'push'
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/subir_correccion.sh
